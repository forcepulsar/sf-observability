name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Lint
        run: ruff check ingest/

  shell:
    name: Validate shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check schema scripts parse cleanly
        run: bash -n schema/setup.sh && bash -n schema/validate_schema.sh

      - name: Check entrypoint parses cleanly
        run: bash -n ingest/entrypoint.sh
