# Salesforce Security & Pipeline Alerting Rules
#
# These rules fire against ClickHouse Cloud via the provisioned datasource.
# Before enabling: replace CLICKHOUSE_DS_UID with the actual datasource UID.
# Find it at: Grafana → Connections → Data Sources → your ClickHouse datasource → copy the UID from the URL.
#
# Grafana alerting docs: https://grafana.com/docs/grafana/latest/alerting/set-up/provision-alerting-resources/file-provisioning/

apiVersion: 1

groups:
  # ── Security alerts ─────────────────────────────────────────────────────────

  - name: Salesforce Security
    folder: Salesforce Alerts
    interval: 10m
    rules:

      - uid: sf-impossible-travel
        title: Impossible Travel — Same User, Multiple Countries
        condition: C
        for: 0s
        annotations:
          summary: "User {{ $labels.user_name }} logged in from multiple countries within 1 hour"
          description: "Possible account compromise or shared credential. Review login_events for this user."
        labels:
          severity: high
          team: security
        data:
          - refId: A
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: CLICKHOUSE_DS_UID
            model:
              rawSql: |
                SELECT
                  user_name,
                  countDistinct(country) AS country_count
                FROM salesforceProd.login_events FINAL
                WHERE
                  timestamp >= now() - INTERVAL 1 HOUR
                  AND login_status = 'LOGIN_NO_ERROR'
                  AND country != ''
                GROUP BY user_name
                HAVING country_count >= 2
              format: table
          - refId: C
            datasourceUid: "-100"
            model:
              conditions:
                - evaluator: { params: [0], type: gt }
                  operator: { type: and }
                  query: { params: [A] }
                  reducer: { params: [], type: count }
              refId: C
              type: classic_conditions

      - uid: sf-bulk-export-spike
        title: Large Bulk Export — Unusual Volume
        condition: C
        for: 0s
        annotations:
          summary: "High-volume bulk export detected: {{ $values.A }} records"
          description: "A single bulk API job exported an unusually large number of records. Review bulk_api2_events."
        labels:
          severity: medium
          team: security
        data:
          - refId: A
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: CLICKHOUSE_DS_UID
            model:
              rawSql: |
                SELECT max(rows_processed) AS max_rows
                FROM salesforceProd.bulk_api2_events FINAL
                WHERE
                  timestamp >= now() - INTERVAL 1 HOUR
                  AND operation_type IN ('query', 'queryAll')
              format: table
          - refId: C
            datasourceUid: "-100"
            model:
              conditions:
                - evaluator: { params: [50000], type: gt }
                  operator: { type: and }
                  query: { params: [A] }
                  reducer: { params: [], type: last }
              refId: C
              type: classic_conditions

      - uid: sf-auth-failure-burst
        title: Authentication Failure Burst — Possible Credential Stuffing
        condition: C
        for: 0s
        annotations:
          summary: "{{ $values.A }} failed logins in the last 15 minutes"
          description: "High volume of login failures may indicate a credential stuffing attack. Check login_events grouped by source_ip."
        labels:
          severity: high
          team: security
        data:
          - refId: A
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: CLICKHOUSE_DS_UID
            model:
              rawSql: |
                SELECT count() AS failure_count
                FROM salesforceProd.login_events FINAL
                WHERE
                  timestamp >= now() - INTERVAL 15 MINUTE
                  AND login_status != 'LOGIN_NO_ERROR'
              format: table
          - refId: C
            datasourceUid: "-100"
            model:
              conditions:
                - evaluator: { params: [100], type: gt }
                  operator: { type: and }
                  query: { params: [A] }
                  reducer: { params: [], type: last }
              refId: C
              type: classic_conditions

      - uid: sf-admin-impersonation
        title: Admin Login-As Activity Detected
        condition: C
        for: 0s
        annotations:
          summary: "Admin impersonation: {{ $labels.delegate_user }} logged in as {{ $labels.actual_user }}"
          description: "A Salesforce administrator used Login-As. Review login_as_events for context."
        labels:
          severity: low
          team: security
        data:
          - refId: A
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: CLICKHOUSE_DS_UID
            model:
              rawSql: |
                SELECT count() AS impersonation_count
                FROM salesforceProd.login_as_events FINAL
                WHERE timestamp >= now() - INTERVAL 1 HOUR
              format: table
          - refId: C
            datasourceUid: "-100"
            model:
              conditions:
                - evaluator: { params: [0], type: gt }
                  operator: { type: and }
                  query: { params: [A] }
                  reducer: { params: [], type: last }
              refId: C
              type: classic_conditions

  # ── Pipeline health alerts ───────────────────────────────────────────────────

  - name: Ingest Pipeline Health
    folder: Salesforce Alerts
    interval: 30m
    rules:

      - uid: sf-ingest-stale
        title: Ingest Pipeline Stale — No New Data in 8 Hours
        condition: C
        for: 0s
        annotations:
          summary: "No new rows ingested in 8+ hours"
          description: "The ingest container may have stopped or lost connectivity. Check docker compose logs ingest."
        labels:
          severity: critical
          team: ops
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: CLICKHOUSE_DS_UID
            model:
              rawSql: |
                SELECT
                  dateDiff('hour', max(ingested_at), now()) AS hours_since_last_ingest
                FROM salesforceProd.ingestion_state FINAL
              format: table
          - refId: C
            datasourceUid: "-100"
            model:
              conditions:
                - evaluator: { params: [8], type: gt }
                  operator: { type: and }
                  query: { params: [A] }
                  reducer: { params: [], type: last }
              refId: C
              type: classic_conditions

      - uid: sf-watermark-frozen
        title: Ingest Watermark Frozen — Sync Running but Table Not Advancing
        condition: C
        for: 0s
        annotations:
          summary: "ingest_threat_store has run in the last 24h, but setup_audit_trail hasn't advanced in 14+ days"
          description: "Signature of a frozen incremental watermark (the sync executes but the table's max date is stuck — the bug fixed in fix/watermark-deadlock-audit-threats). An active org should produce setup audit records well within 14 days. Check the SetupAuditTrail sync in ingest_threat_store.py and recent ingest logs. This rule only fires when the sync is actually running, so it won't double-report a down container (see sf-ingest-stale)."
        labels:
          severity: warning
          team: ops
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: CLICKHOUSE_DS_UID
            model:
              rawSql: |
                -- days_stale, but only when the threat-store sync actually ran in the
                -- last 24h. If the sync is NOT running, returns 0 (no alert) — a down
                -- container is covered by sf-ingest-stale instead.
                SELECT
                  if(
                    (SELECT count()
                       FROM salesforceProd.ingestion_runs
                       WHERE script = 'ingest_threat_store'
                         AND status IN ('success', 'partial')
                         AND ended_at >= now() - INTERVAL 24 HOUR) > 0,
                    dateDiff('day',
                      (SELECT max(created_date) FROM salesforceProd.setup_audit_trail FINAL),
                      now()),
                    0
                  ) AS days_stale_while_running
              format: table
          - refId: C
            datasourceUid: "-100"
            model:
              conditions:
                - evaluator: { params: [14], type: gt }
                  operator: { type: and }
                  query: { params: [A] }
                  reducer: { params: [], type: last }
              refId: C
              type: classic_conditions

      - uid: sf-api-limit-warning
        title: Salesforce API Limit — Warning Threshold
        condition: C
        for: 0s
        annotations:
          summary: "API usage at {{ $values.A }}% of daily limit"
          description: "Salesforce API consumption is approaching the daily limit. Review api_total_usage_events for top consumers."
        labels:
          severity: warning
          team: ops
        data:
          - refId: A
            relativeTimeRange:
              from: 86400
              to: 0
            datasourceUid: CLICKHOUSE_DS_UID
            model:
              rawSql: |
                SELECT
                  round(
                    countIf(counts_against_api_limit = 1) * 100.0
                    / 920000,   -- 920000 = DailyApiRequests.Max (verified 2026-06); TODO: source dynamically from api_limit table
                    1
                  ) AS pct_used
                FROM salesforceProd.api_total_usage_events FINAL
                WHERE toDate(timestamp) = today()
              format: table
          - refId: C
            datasourceUid: "-100"
            model:
              conditions:
                - evaluator: { params: [70], type: gt }
                  operator: { type: and }
                  query: { params: [A] }
                  reducer: { params: [], type: last }
              refId: C
              type: classic_conditions
